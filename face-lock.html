<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Access | ScamShield</title>
  <link rel="stylesheet" href="face-lock.css">
  <script defer src="face-lock.js"></script>
</head>
<body>
  <main class="auth-card">
    <div class="logo">🛡️ SCAM<span>SHIELD</span></div>
    <div class="face-icon">👤</div>
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Face Access</h1>
    <p class="muted">Allow camera access for this demo, then continue to ScamShield.</p>
    <video id="camera" autoplay muted playsinline></video>
    <div id="status" class="status" role="status">Camera is not started.</div>
    <button id="startCamera" class="secondary">Enable Camera</button>
    <button id="continueBtn" disabled>Continue to ScamShield →</button>
    <p class="note">Demo notice: this page previews your camera but does not identify or authenticate your face. Do not use it as real security.</p>
  </main>
</body>
</html>
